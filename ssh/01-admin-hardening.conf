# Debian SSH security policy. Managed in Git.
# Requires verified administrator SSH public-key access.
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitEmptyPasswords no
UsePAM yes
StrictModes yes
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 10
MaxStartups 10:30:100
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding yes
AllowStreamLocalForwarding yes
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no
HostbasedAuthentication no
IgnoreRhosts yes
SyslogFacility AUTH
LogLevel VERBOSE
PrintMotd no
PrintLastLog yes
TCPKeepAlive yes
ClientAliveInterval 0
UseDNS no
